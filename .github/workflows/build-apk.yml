name: Build ChromaPulse APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Configure Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret GOOGLE_SERVICES_JSON."
          elif [ -f app/google-services.json ]; then
            echo "Using app/google-services.json committed in repository."
          else
            echo "::error::Missing Firebase config! Add a GitHub Repository Secret named GOOGLE_SERVICES_JSON containing the full JSON content of app/google-services.json."
            exit 1
          fi

      - name: Restore debug signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64."
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            echo "::warning::No debug.keystore found. Generating fallback keystore (Google Sign-In requires SHA-1 registered in Firebase)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if gradle :app:assembleDebug --no-daemon --no-configuration-cache; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed. Retrying in 15s..."
              sleep 15
            fi
          done
          exit 1

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ChromaPulse-debug.apk
          ls -lh dist/ChromaPulse-debug.apk

      - name: Upload ChromaPulse APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaPulse-APK
          path: dist/ChromaPulse-debug.apk
          retention-days: 30
          if-no-files-found: error
